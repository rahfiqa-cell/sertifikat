<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sertifikat Mitra UMKM - Capstone Project Bisnis Digital</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{--g:#059669;--bg:#f8fafc;--tx:#0f172a;--card:#fff;--bd:#e2e8f0}
@media(prefers-color-scheme:dark){:root{--bg:#0f172a;--tx:#f1f5f9;--card:#1e293b;--bd:#334155}}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,Arial,sans-serif;background:var(--bg);color:var(--tx);display:flex;justify-content:center;padding:20px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:22px;width:100%;max-width:460px}
h1{font-size:1.15rem;margin:0 0 4px;color:var(--g)}p{margin:0 0 12px;font-size:.85rem;opacity:.8}
label{display:block;font-size:.8rem;font-weight:600;margin:12px 0 4px}
input,select{width:100%;padding:10px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit}
button{width:100%;margin-top:16px;background:var(--g);color:#fff;border:0;padding:12px;border-radius:8px;font-weight:700;cursor:pointer;font-size:1rem}
button:disabled{opacity:.6;cursor:wait}
#msg{margin-top:12px;font-size:.9rem}.ok{color:var(--g)}.err{color:#dc2626}
canvas{display:none}
</style>
</head>
<body>
<div class="card">
<h1>Sertifikat Mitra UMKM Capstone Project 2026/2027</h1>
<p>Pilih nama UMKM Anda dan isi email. Sertifikat (PDF) akan dikirim otomatis.</p>
<form id="f">
<label>Nama UMKM</label>
<select id="nama" required><option value="">Memuat daftar UMKM...</option></select>
<label>Email</label><input id="email" type="email" required maxlength="120">
<label id="kodeLbl" style="display:none">Kode Akses (dari panitia)</label><input id="kode" style="display:none" maxlength="40">
<button id="btn" type="submit">Kirim Sertifikat</button>
</form>
<div id="msg"></div>
</div>
<canvas id="cv" width="1754" height="1240"></canvas>
<script>
/* ===== PENGATURAN ===== */
const CFG={
  excel:"umkm.xlsx",              // kolom A = nama UMKM, B = pemilik (opsional), C = email (opsional)
  template:"template-umkm.png",   // format sertifikat UMKM (unggah sendiri ke repo)
  cx:1000, namaY:672, subY:730,   // posisi nama UMKM & pemilik pada template (ukuran acuan 2000x1414). Y lebih besar = teks turun
  warna:"#002f87",                // warna teks (sesuaikan dengan template)
  judul:"Capstone Project 2026/2027 \u201CMega Aksi Video Promosi Viral untuk 46 UMKM Lokal Bukittinggi\u201D",
  kodeAkses:false                 // ubah true jika di Vercel Anda mengisi KODE_AKSES
};
/* ====================== */
const $=id=>document.getElementById(id);
const cv=$("cv"),ctx=cv.getContext("2d");let W=1754,H=1240,DATA=[];
if(CFG.kodeAkses){$("kode").style.display=$("kodeLbl").style.display="block"}

async function muat(){
  const sel=$("nama");
  try{
    const r=await fetch(CFG.excel+"?v="+Date.now());
    if(!r.ok)throw new Error();
    const wb=XLSX.read(await r.arrayBuffer(),{type:"array"});
    const rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,defval:""});
    const start=/nama/i.test(String((rows[0]||[])[0]))?1:0;
    DATA=rows.slice(start).map(x=>({nama:String(x[0]).trim(),pemilik:String(x[1]||"").trim(),email:String(x[2]||"").trim()})).filter(d=>d.nama);
    if(!DATA.length)throw new Error();
    sel.innerHTML='<option value="">-- Pilih nama UMKM --</option>'+DATA.map((d,i)=>`<option value="${i}">${d.nama.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</option>`).join("");
  }catch(e){
    sel.innerHTML='<option value="">Daftar UMKM tidak ditemukan</option>';
    $("msg").className="err";$("msg").textContent="File "+CFG.excel+" belum ada atau kosong.";
  }
}
$("nama").addEventListener("change",()=>{
  const d=DATA[$("nama").value];
  if(d&&d.email)$("email").value=d.email;
});
function loadTpl(){
  return new Promise(res=>{const im=new Image();im.onload=()=>res(im);im.onerror=()=>res(null);im.src=CFG.template});
}
function wrap(t,x,y,maxW,lh){
  let line="";
  for(const w of t.split(" ")){
    const test=line+w+" ";
    if(ctx.measureText(test).width>maxW&&line){ctx.fillText(line.trim(),x,y);line=w+" ";y+=lh}else line=test;
  }
  ctx.fillText(line.trim(),x,y);
}
async function draw(d){
  const tpl=await loadTpl();
  if(tpl){cv.width=W=tpl.naturalWidth;cv.height=H=tpl.naturalHeight}else{cv.width=W=1754;cv.height=H=1240}
  ctx.clearRect(0,0,W,H);ctx.fillStyle="#fff";ctx.fillRect(0,0,W,H);ctx.textAlign="center";
  const fam='"Times New Roman",Times,serif';
  if(tpl){
    ctx.drawImage(tpl,0,0,W,H);
    const s=W/2000;ctx.fillStyle=CFG.warna;
    let fs=72*s;ctx.font=`bold ${fs}px ${fam}`;
    while(ctx.measureText(d.nama).width>1000*s&&fs>30*s){fs-=2*s;ctx.font=`bold ${fs}px ${fam}`}
    ctx.fillText(d.nama,CFG.cx*s,CFG.namaY*s);
    if(d.pemilik){ctx.font=`${26*s}px ${fam}`;ctx.fillText("Pemilik: "+d.pemilik,CFG.cx*s,CFG.subY*s)}
    return;
  }
  ctx.strokeStyle="#059669";ctx.lineWidth=18;ctx.strokeRect(40,40,W-80,H-80);
  ctx.fillStyle="#059669";ctx.font=`bold 110px ${fam}`;ctx.fillText("SERTIFIKAT",W/2,330);
  ctx.fillStyle="#0f172a";ctx.font=`italic 30px ${fam}`;ctx.fillText("Diberikan kepada:",W/2,450);
  let fs=70;ctx.font=`bold ${fs}px ${fam}`;
  while(ctx.measureText(d.nama).width>1400&&fs>36){fs-=4;ctx.font=`bold ${fs}px ${fam}`}
  ctx.fillText(d.nama,W/2,560);
  ctx.font=`28px ${fam}`;if(d.pemilik)ctx.fillText("Pemilik: "+d.pemilik,W/2,610);
  ctx.font=`32px ${fam}`;
  wrap("atas kerja sama dan partisipasinya sebagai Mitra UMKM dalam "+CFG.judul+".",W/2,700,1250,50);
}
function toPdfBase64(){
  const {jsPDF}=window.jspdf;
  const pdf=new jsPDF({orientation:"landscape",unit:"mm",format:"a4"});
  pdf.addImage(cv.toDataURL("image/jpeg",.9),"JPEG",0,0,297,210);
  return pdf.output("datauristring").split(",")[1];
}
$("f").addEventListener("submit",async e=>{
  e.preventDefault();
  const btn=$("btn"),msg=$("msg"),d=DATA[$("nama").value],email=$("email").value.trim();
  if(!d)return;
  btn.disabled=true;msg.className="";msg.textContent="Membuat dan mengirim sertifikat...";
  try{
    await draw(d);
    const r=await fetch("/api/kirim",{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({jenis:"umkm",nama:d.nama,email,kode:$("kode").value,pdf:toPdfBase64()})});
    const j=await r.json().catch(()=>({}));
    if(!r.ok)throw new Error(j.error||"Gagal mengirim.");
    msg.className="ok";msg.textContent="Berhasil! Cek inbox (atau folder spam) di "+email+".";
  }catch(err){msg.className="err";msg.textContent=err.message}
  btn.disabled=false;
});
muat();
</script>
</body>
</html>
